<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservas | Ativos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
  </head>
  <body class="dashboard-page">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span class="menu-label">Reservas</span>
        </div>
        <button class="icon-button" type="button" data-action="toggle-menu" aria-label="Ocultar menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item" href="/minhas-reservas" data-home-link>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
            <path d="M9 20v-6h6v6"></path>
          </svg>
          <span class="menu-label">Inicio</span>
        </a>
        <a class="nav-item" href="/minhas-reservas" data-master-only data-my-reservations-link>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
            <path d="M8 15h5M8 19h8"></path>
          </svg>
          <span class="menu-label">Minhas reservas</span>
        </a>
        <a class="nav-item" href="/usuarios" data-master-only>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
            <circle cx="9.5" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="menu-label">Usuarios</span>
        </a>
        <a class="nav-item is-active" href="/ativos" aria-current="page" data-master-only>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
            <path d="M3.3 7 12 12l8.7-5"></path>
            <path d="M12 22V12"></path>
          </svg>
          <span class="menu-label">Ativos</span>
        </a>
        <a class="nav-item" href="/tempos" data-master-only>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
          <span class="menu-label">Tempos</span>
        </a>
        <a class="nav-item" href="/reservas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4"></path>
            <path d="M8 2v4"></path>
            <path d="M3 10h18"></path>
            <path d="m9 16 2 2 4-4"></path>
          </svg>
          <span class="menu-label">Reservas</span>
        </a>
      </nav>

      <button class="logout-button" type="button" data-action="logout">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        <span class="menu-label">Sair</span>
      </button>
    </aside>

    <main class="dashboard-main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Administracao</p>
          <h1>Ativos</h1>
        </div>
        <p class="user-chip" id="dashboardUser">Usuario</p>
      </header>

      <section class="management">
        <div class="toolbar">
          <div class="segmented" id="assetViews" aria-label="Visualizacao de ativos">
            <button class="segment is-active" type="button" data-view="todos">Todos</button>
            <button class="segment" type="button" data-view="lixeira">Lixeira</button>
          </div>
          <button class="primary compact icon-text" type="button" data-action="new-asset">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
            <span>Novo ativo</span>
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Identificador</th>
                <th>Tipo</th>
                <th>Status</th>
                <th>Opcoes</th>
              </tr>
            </thead>
            <tbody id="assetsTable"></tbody>
          </table>
        </div>

        <div class="pager">
          <button class="secondary compact icon-only" type="button" data-action="prev-page" aria-label="Pagina anterior" title="Pagina anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <span id="pageInfo">Pagina 1</span>
          <button class="secondary compact icon-only" type="button" data-action="next-page" aria-label="Proxima pagina" title="Proxima pagina">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>

        <p class="status" id="assetsStatus" role="status"></p>
      </section>
    </main>

    <dialog class="modal" id="assetModal">
      <form class="modal-form" method="dialog" id="assetForm">
        <h2 id="assetModalTitle">Novo ativo</h2>
        <input type="hidden" name="id">
        <label>
          Identificador
          <input name="identificador" type="text" required>
        </label>
        <label>
          Descricao
          <textarea name="descricao" rows="3"></textarea>
        </label>
        <label>
          Tipo
          <span class="field-row">
            <select name="tipoId" required></select>
            <button class="secondary icon-only" type="button" data-action="manage-types" aria-label="Gerenciar tipos" title="Gerenciar tipos">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>
          </span>
        </label>
        <div class="modal-actions">
          <button class="secondary compact" type="button" data-action="close-asset-modal">Cancelar</button>
          <button class="primary compact" type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="typesModal">
      <form class="modal-form" method="dialog" id="typeForm">
        <h2>Tipos de ativos</h2>
        <input type="hidden" name="id">
        <label>
          Descricao do tipo
          <input name="descricao" type="text" required>
        </label>
        <div class="modal-actions">
          <button class="secondary compact" type="button" data-action="reset-type">Novo</button>
          <button class="primary compact" type="submit">Salvar tipo</button>
        </div>
        <div class="type-list" id="typeList"></div>
        <button class="secondary compact" type="button" data-action="close-types-modal">Fechar</button>
      </form>
    </dialog>

    <dialog class="modal" id="disableAssetModal">
      <form class="modal-form" method="dialog" id="disableAssetForm">
        <h2>Desativar ativo</h2>
        <input type="hidden" name="id">
        <p id="disableAssetName">Ativo selecionado</p>
        <label>
          Motivo
          <select name="motivo" required>
            <option value="">Selecione</option>
            <option value="defeito">Defeito</option>
            <option value="manutencao">Manutencao</option>
            <option value="reforma">Reforma</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label id="disableDescriptionLabel" hidden>
          Descricao
          <textarea name="descricao" rows="3"></textarea>
        </label>
        <p class="status modal-status" id="disableAssetStatus" role="status"></p>
        <div class="modal-actions">
          <button class="secondary compact" type="button" data-action="close-disable-modal">Cancelar</button>
          <button class="primary compact danger-primary" type="submit">Desativar ativo</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="assetHistoryModal">
      <form class="modal-form" method="dialog">
        <h2>Historico do ativo</h2>
        <div class="history-list" id="assetHistoryList"></div>
        <button class="secondary compact" type="button" data-action="close-history-modal">Fechar</button>
      </form>
    </dialog>

    <dialog class="modal confirm-modal" id="confirmModal">
      <form class="modal-form" method="dialog">
        <div class="confirm-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
          </svg>
        </div>
        <h2 id="confirmTitle">Confirmar acao</h2>
        <p id="confirmMessage">Confirme para continuar.</p>
        <div class="modal-actions">
          <button class="secondary compact" type="button" data-action="cancel-confirm">Cancelar</button>
          <button class="primary compact" type="button" data-action="confirm-action">Confirmar</button>
        </div>
      </form>
    </dialog>

    <script src="/scripts/dashboard.js"></script>
    <script src="/scripts/assets.js"></script>
  </body>
</html>
